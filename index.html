<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Video Call Room (Fixed & Stable)</title>
  <!-- PeerJS Library -->
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f1f5f9; padding: 15px; display: flex; justify-content: center; }
    .app-container { width: 100%; max-width: 360px; background: #fff; padding: 15px; border-radius: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
    h2 { text-align: center; color: #0f172a; font-size: 18px; margin: 0 0 12px 0; }
    
    .room-control { display: flex; gap: 8px; margin-bottom: 12px; }
    .room-control input { flex: 1; padding: 10px; border: 2px solid #e2e8f0; border-radius: 8px; font-size: 14px; }
    .room-control button { padding: 10px 16px; background: #4f46e5; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 14px; }

    /* Tampilan Video 90x90 */
    .video-grid { display: flex; justify-content: center; gap: 10px; margin-bottom: 10px; }
    .video-wrapper { position: relative; width: 90px; height: 90px; background: #1e293b; border-radius: 8px; overflow: hidden; flex-shrink: 0; }
    video { width: 100%; height: 100%; object-fit: cover; }
    .video-label { position: absolute; bottom: 3px; left: 3px; background: rgba(0,0,0,0.6); color: #fff; padding: 1px 4px; border-radius: 3px; font-size: 8px; z-index: 2; }

    /* Tombol Kontrol di Bagian Bawah Video */
    .media-controls { display: flex; justify-content: center; gap: 8px; margin-bottom: 12px; }
    .media-controls button { flex: 1; padding: 8px 4px; background: #e2e8f0; color: #334155; border: none; border-radius: 6px; font-weight: bold; font-size: 11px; cursor: pointer; transition: 0.2s; }
    .media-controls button.active { background: #ef4444; color: white; }

    .chat-box { border-top: 1px solid #e2e8f0; padding-top: 10px; }
    .chat-input { display: flex; gap: 8px; }
    .chat-input input { flex: 1; padding: 8px 10px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 13px; }
    .chat-input button { padding: 8px 14px; background: #10b981; color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 13px; }
    .chat-log { margin-top: 8px; height: 60px; overflow-y: auto; font-size: 12px; color: #475569; display: flex; flex-direction: column; gap: 4px; }
    .status-text { text-align: center; font-size: 13px; color: #64748b; margin-bottom: 8px; font-weight: 500; }
  </style>
</head>
<body>

<div class="app-container">
  <h2>Video Call</h2>
  
  <div class="room-control">
    <input type="text" id="roomInput" placeholder="Kode room...">
    <button onclick="joinRoom()">Masuk</button>
  </div>

  <div class="status-text" id="statusText">Masukkan kode untuk mulai</div>

  <!-- Tampilan Video -->
  <div class="video-grid">
    <div class="video-wrapper">
      <video id="videoRemote" autoplay playsinline></video>
      <span class="video-label">Lawan</span>
    </div>
    <div class="video-wrapper">
      <video id="videoLocal" autoplay muted playsinline></video>
      <span class="video-label">Anda</span>
    </div>
  </div>

  <!-- Tombol Kontrol Kamera & Audio -->
  <div class="media-controls">
    <button id="btnToggleCam" onclick="toggleCamera()">Matikan Video</button>
    <button id="btnToggleMic" onclick="toggleAudio()">Matikan Audio</button>
    <button onclick="switchCamera()">Putar Kamera</button>
  </div>

  <div class="chat-box">
    <div class="chat-input">
      <input type="text" id="msgInput" placeholder="Pesan..." onkeypress="if(event.key==='Enter') sendMessage()">
      <button onclick="sendMessage()">Kirim</button>
    </div>
    <div id="chatLog" class="chat-log"></div>
  </div>
</div>

<script>
  let peer, localStream, activeCall, activeConnection;
  let useFrontCamera = true;
  let isSwitching = false;

  const lowDataConstraints = {
    video: { 
      width: { ideal: 128 }, 
      height: { ideal: 128 }, 
      frameRate: { ideal: 7, max: 8 } 
    },
    audio: { 
      echoCancellation: true, 
      noiseSuppression: true,
      sampleRate: 16000 
    }
  };

  async function initCamera() {
    if (isSwitching) return;
    isSwitching = true;
    try {
      const constraints = {
        ...lowDataConstraints,
        video: {
          ...lowDataConstraints.video,
          facingMode: useFrontCamera ? "user" : "environment"
        }
      };

      if (localStream) {
        localStream.getTracks().forEach(track => track.stop());
      }

      localStream = await navigator.mediaDevices.getUserMedia(constraints);
      document.getElementById('videoLocal').srcObject = localStream;
      
      // Perbarui stream video ke lawan bicara jika sedang menelepon
      if (activeCall && activeCall.peerConnection) {
        const sender = activeCall.peerConnection.getSenders().find(s => s.track && s.track.kind === 'video');
        if (sender) {
          sender.replaceTrack(localStream.getVideoTracks()[0]);
        }
      }
    } catch (err) {
      console.error("Gagal akses kamera:", err);
      alert("Tidak dapat mengakses kamera/mikrofon.");
    } finally {
      isSwitching = false;
    }
  }

  async function switchCamera() {
    useFrontCamera = !useFrontCamera;
    await initCamera();
  }

  function toggleCamera() {
    if (!localStream) return;
    const videoTrack = localStream.getVideoTracks()[0];
    if (videoTrack) {
      videoTrack.enabled = !videoTrack.enabled;
      const btn = document.getElementById('btnToggleCam');
      if (videoTrack.enabled) {
        btn.textContent = "Matikan Video";
        btn.classList.remove('active');
      } else {
        btn.textContent = "Buka Video";
        btn.classList.add('active');
      }
    }
  }

  function toggleAudio() {
    if (!localStream) return;
    const audioTrack = localStream.getAudioTracks()[0];
    if (audioTrack) {
      audioTrack.enabled = !audioTrack.enabled;
      const btn = document.getElementById('btnToggleMic');
      if (audioTrack.enabled) {
        btn.textContent = "Matikan Audio";
        btn.classList.remove('active');
      } else {
        btn.textContent = "Buka Audio";
        btn.classList.add('active');
      }
    }
  }

  async function joinRoom() {
    const code = document.getElementById('roomInput').value.trim();
    if (!code) return alert("Masukkan kode room terlebih dahulu!");
    
    await initCamera();
    document.getElementById('statusText').textContent = "Menghubungkan ke room...";

    if (peer) peer.destroy();
    
    peer = new Peer("room_" + code, {
      config: { 'iceServers': [{ urls: 'stun:stun.l.google.com:19302' }] }
    });

    peer.on('error', (err) => {
      // Jika ID room sudah dipakai, coba sambungkan sebagai klien
      if (err.type === 'unavailable-id') {
        const clientPeer = new Peer({
          config: { 'iceServers': [{ urls: 'stun:stun.l.google.com:19302' }] }
        });
        
        clientPeer.on('open', () => {
          peer = clientPeer;
          const call = clientPeer.call("room_" + code, localStream);
          handleCall(call);
          activeConnection = clientPeer.connect("room_" + code);
          setupChat(activeConnection);
        });
      } else {
        document.getElementById('statusText').textContent = "Koneksi gagal, coba lagi.";
      }
    });

    peer.on('open', () => {
      document.getElementById('statusText').textContent = "Menunggu lawan bicara...";
    });

    peer.on('call', (call) => {
      call.answer(localStream);
      handleCall(call);
    });

    peer.on('connection', (conn) => {
      activeConnection = conn;
      setupChat(conn);
    });
  }

  function handleCall(call) {
    activeCall = call;
    call.on('stream', (stream) => {
      document.getElementById('videoRemote').srcObject = stream;
      document.getElementById('statusText').textContent = "Terhubung!";
    });

    // Menangani saat panggilan terputus di tengah jalan
    call.on('close', () => {
      document.getElementById('statusText').textContent = "Lawan bicara keluar.";
      document.getElementById('videoRemote').srcObject = null;
    });
  }

  function setupChat(conn) {
    conn.on('data', (data) => {
      const log = document.getElementById('chatLog');
      log.innerHTML += `<div>Teman: ${data}</div>`;
      log.scrollTop = log.scrollHeight;
    });
    
    conn.on('close', () => {
      const log = document.getElementById('chatLog');
      log.innerHTML += `<div style="color: #ef4444;">Koneksi chat terputus.</div>`;
    });
  }

  function sendMessage() {
    const input = document.getElementById('msgInput');
    if (activeConnection && input.value) {
      activeConnection.send(input.value);
      document.getElementById('chatLog').innerHTML += `<div>Anda: ${input.value}</div>`;
      input.value = "";
    }
  }

  initCamera();
</script>
</body>
</html>
