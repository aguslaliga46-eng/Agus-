<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplikasi Video Call Online</title>
    <!-- Tailwind CSS untuk tampilan modern -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Firebase SDK (Compat Version untuk kemudahan integrasi) -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen flex flex-col justify-between">

    <!-- Header -->
    <header class="bg-slate-800 p-4 shadow-md text-center">
        <h1 class="text-xl font-bold text-blue-400">WebRTC Video Call (Mode 3G)</h1>
        <p id="status-text" class="text-sm text-slate-400">Status: Memuat kamera...</p>
    </header>

    <!-- Konten Utama (Video Grid - Persegi 4 / 1:1) -->
    <main class="flex-1 p-4 max-w-2xl mx-auto w-full flex flex-col sm:flex-row gap-4 items-center justify-center">
        <!-- Video Lokal (Saya) -->
        <div class="relative w-48 h-48 sm:w-56 sm:h-56 bg-black rounded-2xl overflow-hidden shadow-lg border-2 border-slate-700 flex items-center justify-center">
            <video id="localVideo" autoplay muted playsinline class="w-full h-full object-cover transform -scale-x-100"></video>
            <span class="absolute bottom-2 left-2 bg-black/60 px-2 py-0.5 rounded text-[10px]">Anda</span>
        </div>

        <!-- Video Remote (Lawan Bicara) -->
        <div class="relative w-48 h-48 sm:w-56 sm:h-56 bg-black rounded-2xl overflow-hidden shadow-lg border-2 border-slate-700 flex items-center justify-center">
            <video id="remoteVideo" autoplay playsinline class="w-full h-full object-cover"></video>
            <span id="remote-label" class="absolute bottom-2 left-2 bg-black/60 px-2 py-0.5 rounded text-[10px]">Menunggu...</span>
        </div>
    </main>

    <!-- Kontrol Panel -->
    <footer class="bg-slate-800 p-4 shadow-inner">
        <div class="max-w-xl mx-auto flex flex-col sm:flex-row items-center justify-center gap-3">
            <input type="text" id="roomInput" placeholder="Masukkan atau Buat ID Ruangan" class="px-4 py-2 rounded-lg bg-slate-700 text-white border border-slate-600 focus:outline-none focus:border-blue-500 w-full sm:w-auto flex-1">
            <button id="createBtn" class="bg-blue-600 hover:bg-blue-700 px-5 py-2 rounded-lg font-medium transition w-full sm:w-auto">Buat Ruangan</button>
            <button id="joinBtn" class="bg-green-600 hover:bg-green-700 px-5 py-2 rounded-lg font-medium transition w-full sm:w-auto">Gabung Ruangan</button>
            <button id="hangupBtn" class="bg-red-600 hover:bg-red-700 px-5 py-2 rounded-lg font-medium transition hidden w-full sm:w-auto">Keluar</button>
        </div>
    </footer>

    <!-- Logika Aplikasi -->
    <script>
        // Konfigurasi Firebase Anda
        const firebaseConfig = {
            databaseURL: "https://kamal-60b2c-default-rtdb.asia-southeast1.firebasedatabase.app"
        };

        // Inisialisasi Firebase
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // Konfigurasi STUN Server gratis dari Google
        const servers = {
            iceServers: [
                { urls: ['stun:stun1.l.google.com:19302', 'stun:stun2.l.google.com:19302'] }
            ]
        };

        let pc;
        let localStream = null;
        let remoteStream;
        let roomId = null;

        const localVideo = document.getElementById('localVideo');
        const remoteVideo = document.getElementById('remoteVideo');
        const createBtn = document.getElementById('createBtn');
        const joinBtn = document.getElementById('joinBtn');
        const hangupBtn = document.getElementById('hangupBtn');
        const roomInput = document.getElementById('roomInput');
        const statusText = document.getElementById('status-text');
        const remoteLabel = document.getElementById('remote-label');

        // Fungsi untuk membuat string acak yang aman (tidak bisa ditebak)
        function generateSecureRoomId() {
            const characters = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
            let result = '';
            const length = 16;
            for (let i = 0; i < length; i++) {
                result += characters.charAt(Math.floor(Math.random() * characters.length));
            }
            return 'room-' + result + '-' + Date.now().toString(36);
        }

        // 1. Ambil izin kamera dengan resolusi sangat kecil (Ultra Low Resolution untuk jaringan 3G)
        async function initCamera() {
            statusText.innerText = "Status: Meminta izin kamera dan mikrofon...";
            try {
                // Resolusi diperkecil ke 160x120 dan 10 fps agar lancar di jaringan 3G / lambat
                const constraints = {
                    video: { width: { ideal: 160 }, height: { ideal: 120 }, frameRate: { ideal: 10 } },
                    audio: true
                };

                localStream = await navigator.mediaDevices.getUserMedia(constraints);
                localVideo.srcObject = localStream;
                statusText.innerText = "Status: Kamera siap (Mode 3G). Klik 'Buat Ruangan' atau masukkan ID.";
            } catch (error) {
                console.warn('Gagal akses kamera langsung, mencoba ulang...', error);
                statusText.innerText = "Status: Izinkan akses kamera/mikrofon di browser Anda!";
                
                setTimeout(async () => {
                    try {
                        const constraints = {
                            video: { width: { ideal: 160 }, height: { ideal: 120 }, frameRate: { ideal: 10 } },
                            audio: true
                        };
                        localStream = await navigator.mediaDevices.getUserMedia(constraints);
                        localVideo.srcObject = localStream;
                        statusText.innerText = "Status: Kamera siap (Mode 3G). Klik 'Buat Ruangan' atau masukkan ID.";
                    } catch (err) {
                        statusText.innerText = "Status: Gagal mengakses kamera. Periksa izin browser!";
                    }
                }, 1500);
            }
        }

        initCamera();

        // 2. Buat Ruangan Baru (Caller) dengan ID Acak yang Aman
        createBtn.onclick = async () => {
            if (!localStream) {
                await initCamera();
                if (!localStream) {
                    alert("Kamera belum siap! Pastikan Anda sudah memberikan izin akses kamera.");
                    return;
                }
            }

            roomId = roomInput.value.trim() || generateSecureRoomId();
            roomInput.value = roomId;
            roomInput.disabled = true;
            createBtn.disabled = true;
            joinBtn.disabled = true;
            hangupBtn.classList.remove('hidden');

            statusText.innerText = `Status: Ruangan dibuat. Salin ID untuk dibagikan.`;

            pc = new RTCPeerConnection(servers);

            localStream.getTracks().forEach(track => pc.addTrack(track, localStream));

            remoteStream = new MediaStream();
            remoteVideo.srcObject = remoteStream;
            pc.ontrack = event => {
                event.streams[0].getTracks().forEach(track => {
                    remoteStream.addTrack(track);
                });
                remoteLabel.innerText = "Terhubung";
            };

            const roomRef = db.ref(`rooms/${roomId}`);
            const callerCandidatesRef = roomRef.child('callerCandidates');
            const calleeCandidatesRef = roomRef.child('calleeCandidates');

            pc.onicecandidate = event => {
                if (event.candidate) {
                    callerCandidatesRef.push(event.candidate.toJSON());
                }
            };

            const offer = await pc.createOffer();
            await pc.setLocalDescription(offer);

            const roomWithOffer = {
                offer: {
                    type: offer.type,
                    sdp: offer.sdp
                }
            };

            await roomRef.set(roomWithOffer);

            roomRef.on('value', async snapshot => {
                const data = snapshot.val();
                if (!pc.currentRemoteDescription && data && data.answer) {
                    const answer = new RTCSessionDescription(data.answer);
                    await pc.setRemoteDescription(answer);
                    statusText.innerText = "Status: Terhubung dengan lawan bicara!";
                }
            });

            calleeCandidatesRef.on('child_added', snapshot => {
                const candidate = new RTCIceCandidate(snapshot.val());
                pc.addIceCandidate(candidate);
            });
        };

        // 3. Gabung Ruangan (Callee)
        joinBtn.onclick = async () => {
            roomId = roomInput.value.trim();
            if (!roomId) {
                alert("Masukkan ID Ruangan terlebih dahulu!");
                return;
            }
            if (!localStream) {
                await initCamera();
                if (!localStream) {
                    alert("Kamera belum siap! Pastikan Anda sudah memberikan izin akses kamera.");
                    return;
                }
            }

            roomInput.disabled = true;
            createBtn.disabled = true;
            joinBtn.disabled = true;
            hangupBtn.classList.remove('hidden');

            statusText.innerText = `Status: Bergabung ke ruangan...`;

            pc = new RTCPeerConnection(servers);

            localStream.getTracks().forEach(track => pc.addTrack(track, localStream));

            remoteStream = new MediaStream();
            remoteVideo.srcObject = remoteStream;
            pc.ontrack = event => {
                event.streams[0].getTracks().forEach(track => {
                    remoteStream.addTrack(track);
                });
                remoteLabel.innerText = "Terhubung";
            };

            const roomRef = db.ref(`rooms/${roomId}`);
            const callerCandidatesRef = roomRef.child('callerCandidates');
            const calleeCandidatesRef = roomRef.child('calleeCandidates');

            pc.onicecandidate = event => {
                if (event.candidate) {
                    calleeCandidatesRef.push(event.candidate.toJSON());
                }
            };

            const roomSnapshot = await roomRef.once('value');
            const roomData = roomSnapshot.val();
            if (!roomData) {
                alert("Ruangan tidak ditemukan atau sudah ditutup!");
                window.location.reload();
                return;
            }

            const offer = roomData.offer;
            await pc.setRemoteDescription(new RTCSessionDescription(offer));

            const answer = await pc.createAnswer();
            await pc.setLocalDescription(answer);

            await roomRef.update({
                answer: {
                    type: answer.type,
                    sdp: answer.sdp
                }
            });

            statusText.innerText = "Status: Terhubung!";

            callerCandidatesRef.on('child_added', snapshot => {
                const candidate = new RTCIceCandidate(snapshot.val());
                pc.addIceCandidate(candidate);
            });
        };

        // 4. Keluar / Akhiri Panggilan
        hangupBtn.onclick = () => {
            if (pc) {
                pc.close();
            }
            if (localStream) {
                localStream.getTracks().forEach(track => track.stop());
            }
            if (roomId) {
                db.ref(`rooms/${roomId}`).remove();
            }
            window.location.reload();
        };
    </script>
</body>
</html>
