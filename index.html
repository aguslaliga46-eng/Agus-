<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplikasi Video Call Online</title>
    <!-- Tailwind CSS untuk tampilan modern -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Firebase SDK (Compat Version untuk kemudahan integrasi) -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen flex flex-col justify-between">

    <!-- Header -->
    <header class="bg-slate-800 p-4 shadow-md text-center">
        <h1 class="text-xl font-bold text-blue-400">WebRTC Video Call</h1>
        <p id="status-text" class="text-sm text-slate-400">Status: Memuat...</p>
    </header>

    <!-- Konten Utama (Video Grid) -->
    <main class="flex-1 p-4 max-w-6xl mx-auto w-full flex flex-col md:flex-row gap-4 items-center justify-center">
        <!-- Video Lokal (Saya) -->
        <div class="relative w-full md:w-1/2 bg-black rounded-xl overflow-hidden shadow-lg aspect-video flex items-center justify-center">
            <video id="localVideo" autoplay muted playsinline class="w-full h-full object-cover transform -scale-x-100"></video>
            <span class="absolute bottom-3 left-3 bg-black/60 px-3 py-1 rounded-md text-xs">Anda</span>
        </div>

        <!-- Video Remote (Lawan Bicara) -->
        <div class="relative w-full md:w-1/2 bg-black rounded-xl overflow-hidden shadow-lg aspect-video flex items-center justify-center">
            <video id="remoteVideo" autoplay playsinline class="w-full h-full object-cover"></video>
            <span id="remote-label" class="absolute bottom-3 left-3 bg-black/60 px-3 py-1 rounded-md text-xs">Menunggu Lawan Bicara...</span>
        </div>
    </main>

    <!-- Kontrol Panel -->
    <footer class="bg-slate-800 p-4 shadow-inner">
        <div class="max-w-xl mx-auto flex flex-col sm:flex-row items-center justify-center gap-3">
            <input type="text" id="roomInput" placeholder="Masukkan ID Ruangan" class="px-4 py-2 rounded-lg bg-slate-700 text-white border border-slate-600 focus:outline-none focus:border-blue-500 w-full sm:w-auto flex-1">
            <button id="createBtn" class="bg-blue-600 hover:bg-blue-700 px-5 py-2 rounded-lg font-medium transition w-full sm:w-auto">Buat Ruangan</button>
            <button id="joinBtn" class="bg-green-600 hover:bg-green-700 px-5 py-2 rounded-lg font-medium transition w-full sm:w-auto">Gabung Ruangan</button>
            <button id="hangupBtn" class="bg-red-600 hover:bg-red-700 px-5 py-2 rounded-lg font-medium transition hidden w-full sm:w-auto">Keluar</button>
        </div>
    </footer>

    <!-- Logika Aplikasi -->
    <script>
        // Konfigurasi Firebase Anda
        const firebaseConfig = {
            databaseURL: "https://kamal-60b2c-default-rtdb.asia-southeast1.firebasedatabase.app"
        };

        // Inisialisasi Firebase
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // Konfigurasi STUN Server gratis dari Google untuk jalur koneksi WebRTC
        const servers = {
            iceServers: [
                { urls: ['stun:stun1.l.google.com:19302', 'stun:stun2.l.google.com:19302'] }
            ]
        };

        let pc;
        let localStream;
        let remoteStream;
        let roomId = null;

        const localVideo = document.getElementById('localVideo');
        const remoteVideo = document.getElementById('remoteVideo');
        const createBtn = document.getElementById('createBtn');
        const joinBtn = document.getElementById('joinBtn');
        const hangupBtn = document.getElementById('hangupBtn');
        const roomInput = document.getElementById('roomInput');
        const statusText = document.getElementById('status-text');
        const remoteLabel = document.getElementById('remote-label');

        // 1. Ambil izin kamera dan mikrofon saat halaman dimuat
        async function initCamera() {
            try {
                localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                localVideo.srcObject = localStream;
                statusText.innerText = "Status: Kamera siap. Silakan buat atau gabung ruangan.";
            } catch (error) {
                console.error('Gagal mengakses media:', error);
                statusText.innerText = "Status: Gagal mengakses kamera/mikrofon!";
            }
        }

        initCamera();

        // 2. Buat Ruangan Baru (Caller)
        createBtn.onclick = async () => {
            if (!localStream) {
                alert("Kamera belum siap!");
                return;
            }

            roomId = roomInput.value.trim() || Math.random().toString(36.substring(2, 8));
            roomInput.value = roomId;
            roomInput.disabled = true;
            createBtn.disabled = true;
            joinBtn.disabled = true;
            hangupBtn.classList.remove('hidden');

            statusText.innerText = `Status: Membuat ruangan (${roomId})...`;

            pc = new RTCPeerConnection(servers);

            // Tambahkan track lokal ke PeerConnection
            localStream.getTracks().forEach(track => pc.addTrack(track, localStream));

            // Siapkan penampung video remote
            remoteStream = new MediaStream();
            remoteVideo.srcObject = remoteStream;
            pc.ontrack = event => {
                event.streams[0].getTracks().forEach(track => {
                    remoteStream.addTrack(track);
                });
                remoteLabel.innerText = "Terhubung";
            };

            const roomRef = db.ref(`rooms/${roomId}`);
            const callerCandidatesRef = roomRef.child('callerCandidates');
            const calleeCandidatesRef = roomRef.child('calleeCandidates');

            // Kumpulkan ICE candidates
            pc.onicecandidate = event => {
                if (event.candidate) {
                    callerCandidatesRef.push(event.candidate.toJSON());
                }
            };

            // Buat Offer
            const offer = await pc.createOffer();
            await pc.setLocalDescription(offer);

            const roomWithOffer = {
                offer: {
                    type: offer.type,
                    sdp: offer.sdp
                }
            };

            await roomRef.set(roomWithOffer);
            statusText.innerText = `Status: Menunggu partisipan lain bergabung di ID: ${roomId}`;

            // Dengarkan jawaban (answer) dari callee
            roomRef.on('value', async snapshot => {
                const data = snapshot.val();
                if (!pc.currentRemoteDescription && data && data.answer) {
                    const answer = new RTCSessionDescription(data.answer);
                    await pc.setRemoteDescription(answer);
                    statusText.innerText = "Status: Terhubung dengan lawan bicara!";
                }
            });

            // Dengarkan ICE candidates dari callee
            calleeCandidatesRef.on('child_added', snapshot => {
                const candidate = new RTCIceCandidate(snapshot.val());
                pc.addIceCandidate(candidate);
            });
        };

        // 3. Gabung Ruangan (Callee)
        joinBtn.onclick = async () => {
            roomId = roomInput.value.trim();
            if (!roomId) {
                alert("Masukkan ID Ruangan terlebih dahulu!");
                return;
            }
            if (!localStream) {
                alert("Kamera belum siap!");
                return;
            }

            roomInput.disabled = true;
            createBtn.disabled = true;
            joinBtn.disabled = true;
            hangupBtn.classList.remove('hidden');

            statusText.innerText = `Status: Bergabung ke ruangan ${roomId}...`;

            pc = new RTCPeerConnection(servers);

            localStream.getTracks().forEach(track => pc.addTrack(track, localStream));

            remoteStream = new MediaStream();
            remoteVideo.srcObject = remoteStream;
            pc.ontrack = event => {
                event.streams[0].getTracks().forEach(track => {
                    remoteStream.addTrack(track);
                });
                remoteLabel.innerText = "Terhubung";
            };

            const roomRef = db.ref(`rooms/${roomId}`);
            const callerCandidatesRef = roomRef.child('callerCandidates');
            const calleeCandidatesRef = roomRef.child('calleeCandidates');

            pc.onicecandidate = event => {
                if (event.candidate) {
                    calleeCandidatesRef.push(event.candidate.toJSON());
                }
            };

            // Ambil data offer dari database
            const roomSnapshot = await roomRef.once('value');
            const roomData = roomSnapshot.val();
            if (!roomData) {
                alert("Ruangan tidak ditemukan!");
                window.location.reload();
                return;
            }

            const offer = roomData.offer;
            await pc.setRemoteDescription(new RTCSessionDescription(offer));

            // Buat Answer
            const answer = await pc.createAnswer();
            await pc.setLocalDescription(answer);

            await roomRef.update({
                answer: {
                    type: answer.type,
                    sdp: answer.sdp
                }
            });

            statusText.innerText = "Status: Terhubung!";

            // Dengarkan ICE candidates dari caller
            callerCandidatesRef.on('child_added', snapshot => {
                const candidate = new RTCIceCandidate(snapshot.val());
                pc.addIceCandidate(candidate);
            });
        };

        // 4. Keluar / Akhiri Panggilan
        hangupBtn.onclick = () => {
            if (pc) {
                pc.close();
            }
            if (localStream) {
                localStream.getTracks().forEach(track => track.stop());
            }
            if (roomId) {
                db.ref(`rooms/${roomId}`).remove();
            }
            window.location.reload();
        };
    </script>
</body>
</html>
