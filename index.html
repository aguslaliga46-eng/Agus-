<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Video Call Room (Ultra Mini 1:1)</title>
  <!-- PeerJS Library -->
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f1f5f9; padding: 15px; display: flex; justify-content: center; }
    .app-container { width: 100%; max-width: 360px; background: #fff; padding: 15px; border-radius: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
    h2 { text-align: center; color: #0f172a; font-size: 18px; margin: 0 0 12px 0; }
    
    .room-control { display: flex; gap: 8px; margin-bottom: 12px; }
    .room-control input { flex: 1; padding: 10px; border: 2px solid #e2e8f0; border-radius: 8px; font-size: 14px; }
    .room-control button { padding: 10px 16px; background: #4f46e5; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 14px; }

    /* Tampilan Video Diperkecil Menjadi 90x90 Piksel */
    .video-grid { display: flex; justify-content: center; gap: 10px; margin-bottom: 12px; }
    .video-wrapper { position: relative; width: 90px; height: 90px; background: #1e293b; border-radius: 8px; overflow: hidden; flex-shrink: 0; }
    video { width: 100%; height: 100%; object-fit: cover; }
    .video-label { position: absolute; bottom: 3px; left: 3px; background: rgba(0,0,0,0.6); color: #fff; padding: 1px 4px; border-radius: 3px; font-size: 8px; z-index: 2; }

    .chat-box { border-top: 1px solid #e2e8f0; padding-top: 10px; }
    .chat-input { display: flex; gap: 8px; }
    .chat-input input { flex: 1; padding: 8px 10px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 13px; }
    .chat-input button { padding: 8px 14px; background: #10b981; color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 13px; }
    .chat-log { margin-top: 8px; height: 70px; overflow-y: auto; font-size: 12px; color: #475569; display: flex; flex-direction: column; gap: 4px; }
    .status-text { text-align: center; font-size: 13px; color: #64748b; margin-bottom: 10px; }
  </style>
</head>
<body>

<div class="app-container">
  <h2>Video Call</h2>
  
  <div class="room-control">
    <input type="text" id="roomInput" placeholder="Kode room...">
    <button onclick="joinRoom()">Masuk</button>
  </div>

  <div class="status-text" id="statusText">Masukkan kode untuk mulai</div>

  <!-- Tampilan Video Berjajar Ukuran 90x90 -->
  <div class="video-grid">
    <div class="video-wrapper">
      <video id="videoRemote" autoplay playsinline></video>
      <span class="video-label">Lawan</span>
    </div>
    <div class="video-wrapper">
      <video id="videoLocal" autoplay muted playsinline></video>
      <span class="video-label">Anda</span>
    </div>
  </div>

  <div class="chat-box">
    <div class="chat-input">
      <input type="text" id="msgInput" placeholder="Pesan..." onkeypress="if(event.key==='Enter') sendMessage()">
      <button onclick="sendMessage()">Kirim</button>
    </div>
    <div id="chatLog" class="chat-log"></div>
  </div>
</div>

<script>
  let peer, localStream, activeCall, activeConnection;

  // Konfigurasi Super Hemat Data (Resolusi 128x128, 7-8 fps)
  const lowDataConstraints = {
    video: { 
      width: { ideal: 128 }, 
      height: { ideal: 128 }, 
      frameRate: { ideal: 7, max: 8 } 
    },
    audio: { 
      echoCancellation: true, 
      noiseSuppression: true,
      sampleRate: 16000 
    }
  };

  async function initCamera() {
    try {
      localStream = await navigator.mediaDevices.getUserMedia(lowDataConstraints);
      document.getElementById('videoLocal').srcObject = localStream;
    } catch (err) {
      alert("Izin kamera diperlukan!");
    }
  }

  async function joinRoom() {
    const code = document.getElementById('roomInput').value.trim();
    if (!code) return alert("Masukkan kode!");
    
    await initCamera();
    document.getElementById('statusText').textContent = "Menghubungkan...";

    if (peer) peer.destroy();
    
    peer = new Peer("room_" + code, {
      config: { 'iceServers': [{ urls: 'stun:stun.l.google.com:19302' }] }
    });

    peer.on('error', () => {
      peer = new Peer({ config: { 'iceServers': [{ urls: 'stun:stun.l.google.com:19302' }] } });
      peer.on('open', () => {
        const call = peer.call("room_" + code, localStream);
        handleCall(call);
        activeConnection = peer.connect("room_" + code);
        setupChat(activeConnection);
      });
    });

    peer.on('call', (call) => {
      call.answer(localStream);
      handleCall(call);
    });

    peer.on('connection', (conn) => {
      activeConnection = conn;
      setupChat(conn);
    });
  }

  function handleCall(call) {
    activeCall = call;
    call.on('stream', (stream) => {
      document.getElementById('videoRemote').srcObject = stream;
      document.getElementById('statusText').textContent = "Terhubung!";
    });
  }

  function setupChat(conn) {
    conn.on('data', (data) => {
      const log = document.getElementById('chatLog');
      log.innerHTML += `<div>Teman: ${data}</div>`;
      log.scrollTop = log.scrollHeight;
    });
  }

  function sendMessage() {
    const input = document.getElementById('msgInput');
    if (activeConnection && input.value) {
      activeConnection.send(input.value);
      document.getElementById('chatLog').innerHTML += `<div>Anda: ${input.value}</div>`;
      input.value = "";
    }
  }

  initCamera();
</script>
</body>
</html>
