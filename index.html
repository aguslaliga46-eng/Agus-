<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Video Call Room</title>
  <!-- PeerJS Library -->
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f1f5f9; padding: 15px; display: flex; justify-content: center; }
    .app-container { width: 100%; max-width: 450px; background: #fff; padding: 20px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
    h2 { text-align: center; color: #0f172a; margin-top: 0; }
    
    .room-control { display: flex; gap: 8px; margin: 20px 0; }
    .room-control input { flex: 1; padding: 12px; border: 2px solid #e2e8f0; border-radius: 8px; font-size: 16px; }
    .room-control button { padding: 12px 20px; background: #4f46e5; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }

    .video-grid { display: grid; grid-template-columns: 1fr; gap: 15px; margin-top: 15px; }
    .video-wrapper { position: relative; width: 100%; height: 220px; background: #1e293b; border-radius: 12px; overflow: hidden; display: flex; align-items: center; justify-content: center; }
    video { width: 100%; height: 100%; object-fit: cover; }
    .video-label { position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,0.5); color: #fff; padding: 4px 8px; border-radius: 6px; font-size: 12px; }

    .chat-box { margin-top: 20px; border-top: 1px solid #e2e8f0; padding-top: 15px; }
    .chat-input { display: flex; gap: 8px; }
    .chat-input input { flex: 1; padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px; }
    .chat-input button { padding: 12px 20px; background: #10b981; color: white; border: none; border-radius: 8px; cursor: pointer; }
    .chat-log { margin-top: 10px; height: 100px; overflow-y: auto; font-size: 14px; color: #475569; display: flex; flex-direction: column; gap: 5px; }
    .status-text { text-align: center; font-size: 14px; color: #64748b; margin-bottom: 10px; }
  </style>
</head>
<body>

<div class="app-container">
  <h2>Video Call Room</h2>
  
  <div class="room-control">
    <input type="text" id="roomInput" placeholder="Ketik kode room...">
    <button onclick="joinRoom()">Masuk</button>
  </div>

  <div class="status-text" id="statusText">Masukkan kode untuk memulai</div>

  <div class="video-grid">
    <div class="video-wrapper">
      <video id="videoRemote" autoplay playsinline></video>
      <span class="video-label">Lawan Bicara</span>
    </div>
    <div class="video-wrapper">
      <video id="videoLocal" autoplay muted playsinline></video>
      <span class="video-label">Anda</span>
    </div>
  </div>

  <div class="chat-box">
    <div class="chat-input">
      <input type="text" id="msgInput" placeholder="Pesan..." onkeypress="if(event.key==='Enter') sendMessage()">
      <button onclick="sendMessage()">Kirim</button>
    </div>
    <div id="chatLog" class="chat-log"></div>
  </div>
</div>

<script>
  let peer, localStream, activeCall, activeConnection;

  // Optimasi kamera untuk mobile agar ringan
  async function initCamera() {
    try {
      localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
      document.getElementById('videoLocal').srcObject = localStream;
    } catch (err) {
      alert("Izin kamera/mikrofon diperlukan!");
    }
  }

  async function joinRoom() {
    const code = document.getElementById('roomInput').value.trim();
    if (!code) return alert("Masukkan kode!");
    
    await initCamera();
    document.getElementById('statusText').textContent = "Menghubungkan...";

    if (peer) peer.destroy();
    
    // Gunakan konfigurasi STUN agar koneksi tembus ke jaringan mobile/seluler
    peer = new Peer("room_" + code, {
      config: { 'iceServers': [{ urls: 'stun:stun.l.google.com:19302' }] }
    });

    peer.on('error', () => {
      // Jika room sudah ada, hubungkan sebagai tamu
      peer = new Peer({ config: { 'iceServers': [{ urls: 'stun:stun.l.google.com:19302' }] } });
      peer.on('open', () => {
        const call = peer.call("room_" + code, localStream);
        handleCall(call);
        activeConnection = peer.connect("room_" + code);
        setupChat(activeConnection);
      });
    });

    peer.on('call', (call) => {
      call.answer(localStream);
      handleCall(call);
    });

    peer.on('connection', (conn) => {
      activeConnection = conn;
      setupChat(conn);
    });
  }

  function handleCall(call) {
    activeCall = call;
    call.on('stream', (stream) => {
      document.getElementById('videoRemote').srcObject = stream;
      document.getElementById('statusText').textContent = "Terhubung!";
    });
  }

  function setupChat(conn) {
    conn.on('data', (data) => {
      const log = document.getElementById('chatLog');
      log.innerHTML += `<div>Teman: ${data}</div>`;
      log.scrollTop = log.scrollHeight;
    });
  }

  function sendMessage() {
    const input = document.getElementById('msgInput');
    if (activeConnection && input.value) {
      activeConnection.send(input.value);
      document.getElementById('chatLog').innerHTML += `<div>Anda: ${input.value}</div>`;
      input.value = "";
    }
  }

  initCamera();
</script>

</body>
</html>
