<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Video Call App Pro</title>
  
  <link rel="manifest" href="/i/manifest.json">
  <meta name="theme-color" content="#ffffff">

  <!-- PeerJS Library -->
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f1f5f9; padding: 15px; display: flex; justify-content: center; margin: 0; }
    .app-container { width: 100%; max-width: 360px; background: #fff; padding: 15px; border-radius: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); box-sizing: border-box; position: relative; }
    
    /* Tombol Logout Bulat di Pojok Kiri Atas */
    .logout-btn {
      position: absolute;
      top: 15px;
      left: 15px;
      width: 32px;
      height: 32px;
      background: #ef4444;
      color: white;
      border: none;
      border-radius: 50%;
      font-size: 14px;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 2px 5px rgba(0,0,0,0.15);
      z-index: 10;
    }
    .logout-btn:hover { background: #dc2626; }

    h2, h3 { text-align: center; color: #0f172a; margin: 0 0 10px 0; }
    h2 { font-size: 18px; }
    h3 { font-size: 14px; margin-top: 15px; color: #334155; }
    
    .auth-section, .friend-control { display: flex; gap: 8px; margin-bottom: 8px; }
    input { flex: 1; padding: 10px; border: 2px solid #e2e8f0; border-radius: 8px; font-size: 14px; outline: none; box-sizing: border-box; }
    button { padding: 10px 14px; background: #4f46e5; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 13px; }
    button.secondary { background: #0ea5e9; }
    button.danger { background: #ef4444; }
    button.success { background: #10b981; }
    button.menu-btn { background: #64748b; padding: 6px 10px; font-size: 11px; }
    
    .auth-container { border-bottom: 1px solid #e2e8f0; margin-bottom: 12px; padding-bottom: 12px; }
    .auth-switch { text-align: center; font-size: 12px; color: #64748b; margin-top: 8px; }
    .auth-switch span { color: #4f46e5; font-weight: bold; cursor: pointer; text-decoration: underline; }

    .hidden { display: none !important; }

    /* Tampilan Video 90x90 */
    .video-grid { display: flex; justify-content: center; gap: 10px; margin-bottom: 10px; }
    .video-wrapper { position: relative; width: 90px; height: 90px; background: #1e293b; border-radius: 8px; overflow: hidden; flex-shrink: 0; }
    video { width: 100%; height: 100%; object-fit: cover; }
    .video-label { position: absolute; bottom: 3px; left: 3px; background: rgba(0,0,0,0.6); color: #fff; padding: 1px 4px; border-radius: 3px; font-size: 8px; z-index: 2; }

    .media-controls { display: flex; justify-content: center; gap: 8px; margin-bottom: 8px; }
    .media-controls button { flex: 1; padding: 8px 4px; background: #e2e8f0; color: #334155; border-radius: 6px; font-size: 11px; font-weight: normal; }
    .media-controls button.active { background: #ef4444; color: white; }

    .call-action-controls { display: flex; gap: 8px; margin-bottom: 12px; }
    .call-action-controls button { flex: 1; }

    .list-box { max-height: 120px; overflow-y: auto; border: 1px solid #e2e8f0; border-radius: 8px; padding: 8px; margin-bottom: 10px; font-size: 13px; }
    .list-item { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; background: #f8fafc; padding: 6px; border-radius: 6px; }
    
    .friend-actions { display: flex; gap: 4px; align-items: center; }

    .chat-box { border-top: 1px solid #e2e8f0; padding-top: 10px; }
    .chat-input { display: flex; gap: 8px; }
    .chat-log { margin-top: 8px; height: 60px; overflow-y: auto; font-size: 12px; color: #475569; display: flex; flex-direction: column; gap: 4px; }
    .status-text { text-align: center; font-size: 13px; color: #64748b; margin-bottom: 8px; font-weight: 500; }
  </style>
</head>
<body>

<div class="app-container">
  <!-- Tombol Logout Bulat di Pojok Kiri Atas -->
  <button id="btnLogout" class="logout-btn hidden" title="Keluar">↩</button>

  <h2 id="appTitle">Video Call App</h2>

  <!-- Bagian Autentikasi (Daftar & Masuk) -->
  <div id="authContainer" class="auth-container">
    
    <!-- Form Daftar -->
    <div id="registerForm">
      <div class="auth-section">
        <input type="text" id="registerInput" placeholder="Nama lengkap baru...">
        <button id="btnRegister">Daftar</button>
      </div>
      <div class="auth-switch">
        Sudah punya akun? <span id="toLoginMode">Masuk di sini</span>
      </div>
    </div>

    <!-- Form Masuk (Login) -->
    <div id="loginForm" class="hidden">
      <div class="auth-section">
        <input type="text" id="loginInput" placeholder="Nama lengkap terdaftar...">
        <button id="btnLogin">Masuk</button>
      </div>
      <div class="auth-switch">
        Belum punya akun? <span id="toRegisterMode">Daftar di sini</span>
      </div>
    </div>

  </div>
  
  <!-- Fitur Utama -->
  <div id="callMainContent" class="hidden">
    <div class="status-text" id="statusText">Status: Siap</div>

    <!-- Panel Pertemanan -->
    <div>
      <div class="friend-control">
        <input type="text" id="searchFriendInput" placeholder="Cari nama teman...">
        <button class="secondary" id="btnAddFriend">Tambah</button>
      </div>

      <h3>Permintaan Pertemanan Masuk</h3>
      <div id="incomingRequestsBox" class="list-box">
        <div style="color: #94a3b8; text-align: center;">Tidak ada permintaan</div>
      </div>

      <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 15px; margin-bottom: 5px;">
        <h3 style="margin: 0;">Daftar Teman</h3>
      </div>
      <div style="margin-bottom: 6px;">
        <input type="text" id="quickSearchInput" placeholder="Cari cepat di daftar teman..." style="width: 100%; padding: 6px 10px; font-size: 12px;">
      </div>
      <div id="friendsListBox" class="list-box">
        <div style="color: #94a3b8; text-align: center;">Belum ada teman</div>
      </div>
    </div>

    <!-- Tampilan Video Call -->
    <div class="video-grid">
      <div class="video-wrapper">
        <video id="videoRemote" autoplay playsinline></video>
        <span class="video-label">Lawan</span>
      </div>
      <div class="video-wrapper">
        <video id="videoLocal" autoplay muted playsinline></video>
        <span class="video-label">Anda</span>
      </div>
    </div>

    <div class="media-controls">
      <button id="btnToggleCam">Matikan Video</button>
      <button id="btnToggleMic">Matikan Audio</button>
      <button id="btnSwitchCam">Putar Kamera</button>
    </div>

    <!-- Kontrol Akhiri Panggilan -->
    <div class="call-action-controls">
      <button id="btnEndCall" class="danger hidden">Akhiri Panggilan</button>
    </div>

    <div class="chat-box">
      <div class="chat-input">
        <input type="text" id="msgInput" placeholder="Pesan...">
        <button id="btnSendMsg">Kirim</button>
      </div>
      <div id="chatLog" class="chat-log"></div>
    </div>
  </div>
</div>

<!-- Firebase & PeerJS Logic -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getDatabase, ref, get, set, child, onValue, remove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCaWV3xAbJGYLWcrxZb9iii9BBV1SZU1TE",
    databaseURL: "https://kamal-60b2c-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "kamal-60b2c"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);

  let myNameKey = "";
  let rawMyName = "";
  let peer, localStream, activeCall, activeConnection;
  let useFrontCamera = true;
  let currentChatFriendKey = null;
  let allFriendsData = [];

  // Minta Izin Notifikasi Browser Saat Pertama Kali
  function requestNotificationPermission() {
    if ("Notification" in window && Notification.permission !== "granted") {
      Notification.requestPermission();
    }
  }

  // Suara & Notifikasi Layar (Web Notification + Audio Cling)
  function playClingSound() {
    try {
      const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(800, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(400, audioCtx.currentTime + 0.3);
      gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.3);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.3);
    } catch (e) {}
  }

  function triggerBackgroundNotification(callerName) {
    playClingSound();
    
    // Munculkan Native Notification di HP/Desktop
    if ("Notification" in window && Notification.permission === "granted") {
      new Notification("Panggilan Video Masuk!", {
        body: `${callerName} sedang menelepon Anda.`,
        icon: "https://cdn-icons-png.flaticon.com/512/3067/3067403.png"
      });
    }
  }

  // Pengaturan Event Listener Tombol
  document.addEventListener('DOMContentLoaded', () => {
    requestNotificationPermission();

    const saved = localStorage.getItem('userName');
    if (saved) {
      rawMyName = saved;
      myNameKey = saved.toLowerCase().replace(/\s+/g, '_');
      initAppSession();
    }

    document.getElementById('toLoginMode').addEventListener('click', () => {
      document.getElementById('registerForm').classList.add('hidden');
      document.getElementById('loginForm').classList.remove('hidden');
    });
    document.getElementById('toRegisterMode').addEventListener('click', () => {
      document.getElementById('loginForm').classList.add('hidden');
      document.getElementById('registerForm').classList.remove('hidden');
    });

    document.getElementById('btnRegister').addEventListener('click', registerUser);
    document.getElementById('btnLogin').addEventListener('click', loginUser);
    document.getElementById('btnLogout').addEventListener('click', logoutUser);

    document.getElementById('btnAddFriend').addEventListener('click', sendFriendRequest);
    document.getElementById('quickSearchInput').addEventListener('input', filterFriendsList);
    document.getElementById('btnSendMsg').addEventListener('click', sendMessage);
    document.getElementById('msgInput').addEventListener('keypress', (e) => { if(e.key === 'Enter') sendMessage(); });

    document.getElementById('btnToggleCam').addEventListener('click', toggleCamera);
    document.getElementById('btnToggleMic').addEventListener('click', toggleAudio);
    document.getElementById('btnSwitchCam').addEventListener('click', switchCamera);
    
    // Tombol Akhiri Panggilan
    document.getElementById('btnEndCall').addEventListener('click', endCall);
  });

  async function registerUser() {
    rawMyName = document.getElementById('registerInput').value.trim();
    if (!rawMyName) return alert("Masukkan nama lengkap terlebih dahulu!");

    myNameKey = rawMyName.toLowerCase().replace(/\s+/g, '_');
    const dbRef = ref(db);

    try {
      const snapshot = await get(child(dbRef, `users/${myNameKey}`));
      if (snapshot.exists()) {
        alert("Nama sudah terdaftar! Gunakan nama lain atau silakan Masuk.");
        return;
      }
      await set(ref(db, `users/${myNameKey}`), { fullName: rawMyName });
      localStorage.setItem('userName', rawMyName);
      initAppSession();
    } catch (err) {
      alert("Gagal mendaftar. Coba lagi.");
    }
  }

  async function loginUser() {
    rawMyName = document.getElementById('loginInput').value.trim();
    if (!rawMyName) return alert("Masukkan nama lengkap Anda!");

    myNameKey = rawMyName.toLowerCase().replace(/\s+/g, '_');
    const dbRef = ref(db);

    try {
      const snapshot = await get(child(dbRef, `users/${myNameKey}`));
      if (!snapshot.exists()) {
        alert("Nama belum terdaftar! Silakan daftar terlebih dahulu.");
        return;
      }
      localStorage.setItem('userName', rawMyName);
      initAppSession();
    } catch (err) {
      alert("Gagal masuk. Coba lagi.");
    }
  }

  function initAppSession() {
    document.getElementById('authContainer').classList.add('hidden');
    document.getElementById('callMainContent').classList.remove('hidden');
    document.getElementById('btnLogout').classList.remove('hidden');
    initPeerJS();
    listenToDatabase();
    initCamera();
  }

  function logoutUser() {
    if (confirm("Apakah Anda yakin ingin keluar?")) {
      localStorage.removeItem('userName');
      window.location.reload();
    }
  }

  function initPeerJS() {
    peer = new Peer(myNameKey, {
      config: { 'iceServers': [{ urls: 'stun:stun.l.google.com:19302' }] }
    });

    peer.on('call', async (call) => {
      const friendSnap = await get(child(ref(db), `friends/${myNameKey}/${call.peer}`));
      if (!friendSnap.exists()) {
        call.close();
        return;
      }
      const callerName = friendSnap.val().name || call.peer;
      triggerBackgroundNotification(callerName);

      call.answer(localStream);
      handleCall(call);
      currentChatFriendKey = call.peer;
    });

    peer.on('connection', (conn) => {
      activeConnection = conn;
      setupChat(conn);
    });
  }

  async function sendFriendRequest() {
    const targetName = document.getElementById('searchFriendInput').value.trim();
    const targetKey = targetName.toLowerCase().replace(/\s+/g, '_');

    if (!targetName || targetKey === myNameKey) return alert("Masukkan nama teman yang valid!");

    const dbRef = ref(db);
    const userSnap = await get(child(dbRef, `users/${targetKey}`));
    if (!userSnap.exists()) return alert("Pengguna tidak ditemukan!");

    const friendSnap = await get(child(dbRef, `friends/${myNameKey}/${targetKey}`));
    if (friendSnap.exists()) return alert("Kalian sudah berteman!");

    await set(ref(db, `requests/${targetKey}/${myNameKey}`), { name: rawMyName });
    alert("Permintaan pertemanan dikirim!");
    document.getElementById('searchFriendInput').value = "";
  }

  function listenToDatabase() {
    onValue(ref(db, `requests/${myNameKey}`), (snapshot) => {
      const box = document.getElementById('incomingRequestsBox');
      box.innerHTML = "";
      if (!snapshot.exists()) {
        box.innerHTML = `<div style="color: #94a3b8; text-align: center;">Tidak ada permintaan</div>`;
        return;
      }
      snapshot.forEach((childSnap) => {
        const senderKey = childSnap.key;
        const senderName = childSnap.val().name;
        box.innerHTML += `
          <div class="list-item">
            <span>${senderName}</span>
            <div>
              <button class="success" id="accept_${senderKey}">Terima</button>
              <button class="danger" id="reject_${senderKey}">Tolak</button>
            </div>
          </div>`;
      });
      snapshot.forEach((childSnap) => {
        const senderKey = childSnap.key;
        const senderName = childSnap.val().name;
        document.getElementById(`accept_${senderKey}`).onclick = () => acceptFriend(senderKey, senderName);
        document.getElementById(`reject_${senderKey}`).onclick = () => rejectFriend(senderKey);
      });
    });

    onValue(ref(db, `friends/${myNameKey}`), (snapshot) => {
      allFriendsData = [];
      if (snapshot.exists()) {
        snapshot.forEach((childSnap) => {
          allFriendsData.push({
            key: childSnap.key,
            name: childSnap.val().name
          });
        });
      }
      renderFriendsList(allFriendsData);
    });
  }

  function renderFriendsList(friendsArray) {
    const box = document.getElementById('friendsListBox');
    box.innerHTML = "";
    
    if (friendsArray.length === 0) {
      box.innerHTML = `<div style="color: #94a3b8; text-align: center;">Tidak ada teman ditemukan</div>`;
      return;
    }

    friendsArray.forEach((friend) => {
      box.innerHTML += `
        <div class="list-item">
          <span><b>${friend.name}</b></span>
          <div class="friend-actions">
            <button class="success" id="call_${friend.key}" style="padding: 5px 8px; font-size: 11px;">Panggil</button>
            <button class="menu-btn" id="menu_${friend.key}">Menu</button>
          </div>
        </div>`;
    });

    friendsArray.forEach((friend) => {
      document.getElementById(`call_${friend.key}`).onclick = () => callFriend(friend.key);
      document.getElementById(`menu_${friend.key}`).onclick = () => openFriendMenu(friend.key, friend.name);
    });
  }

  function filterFriendsList() {
    const keyword = document.getElementById('quickSearchInput').value.toLowerCase();
    const filtered = allFriendsData.filter(f => f.name.toLowerCase().includes(keyword));
    renderFriendsList(filtered);
  }

  function openFriendMenu(friendKey, friendName) {
    const choice = prompt(`Menu Teman: ${friendName}\n1. Mulai Chat / Fokuskan\n2. Hapus Pertemanan\nPilih nomor menu (1 atau 2):`);
    if (choice === "1") {
      currentChatFriendKey = friendKey;
      alert(`Chat dialihkan ke ${friendName}. Silakan ketik pesan di bawah.`);
    } else if (choice === "2") {
      if (confirm(`Hapus ${friendName} dari daftar teman?`)) {
        removeFriend(friendKey);
      }
    }
  }

  async function removeFriend(friendKey) {
    await remove(ref(db, `friends/${myNameKey}/${friendKey}`));
    await remove(ref(db, `friends/${friendKey}/${myNameKey}`));
    alert("Teman berhasil dihapus.");
  }

  async function acceptFriend(friendKey, friendName) {
    await set(ref(db, `friends/${myNameKey}/${friendKey}`), { name: friendName });
    await set(ref(db, `friends/${friendKey}/${myNameKey}`), { name: rawMyName });
    await remove(ref(db, `requests/${myNameKey}/${friendKey}`));
  }

  async function rejectFriend(friendKey) {
    await remove(ref(db, `requests/${myNameKey}/${friendKey}`));
  }

  async function callFriend(friendKey) {
    if (!localStream) return alert("Kamera belum siap!");
    
    const friendSnap = await get(child(ref(db), `friends/${myNameKey}/${friendKey}`));
    if (!friendSnap.exists()) return alert("Anda harus konfirmasi pertemanan terlebih dahulu!");

    document.getElementById('statusText').textContent = "Menghubungi teman...";
    currentChatFriendKey = friendKey;

    const call = peer.call(friendKey, localStream);
    handleCall(call);

    activeConnection = peer.connect(friendKey);
    setupChat(activeConnection);
  }

  async function initCamera() {
    try {
      if (localStream) {
        localStream.getTracks().forEach(track => track.stop());
      }
      localStream = await navigator.mediaDevices.getUserMedia({
        video: { width: 128, height: 128, frameRate: 8, facingMode: useFrontCamera ? "user" : "environment" },
        audio: true
      });
      document.getElementById('videoLocal').srcObject = localStream;
    } catch (err) {
      console.log("Izin kamera tertunda/ditolak.");
    }
  }

  async function switchCamera() {
    useFrontCamera = !useFrontCamera;
    await initCamera();
    if (activeCall) {
      const videoTrack = localStream.getVideoTracks()[0];
      const sender = activeCall.peerConnection.getSenders().find(s => s.track && s.track.kind === 'video');
      if (sender) sender.replaceTrack(videoTrack);
    }
  }

  function handleCall(call) {
    activeCall = call;
    document.getElementById('btnEndCall').classList.remove('hidden');

    call.on('stream', (stream) => {
      document.getElementById('videoRemote').srcObject = stream;
      document.getElementById('statusText').textContent = "Terhubung!";
    });

    call.on('close', () => {
      resetCallUI();
    });
  }

  // Fungsi Akhiri Panggilan
  function endCall() {
    if (activeCall) {
      activeCall.close();
    }
    resetCallUI();
  }

  function resetCallUI() {
    if (activeCall) {
      activeCall = null;
    }
    document.getElementById('videoRemote').srcObject = null;
    document.getElementById('statusText').textContent = "Status: Siap";
    document.getElementById('btnEndCall').classList.add('hidden');
  }

  function setupChat(conn) {
    conn.on('data', (data) => {
      const log = document.getElementById('chatLog');
      log.innerHTML += `<div>Teman: ${data}</div>`;
    });
  }

  async function sendMessage() {
    const input = document.getElementById('msgInput');
    const msgText = input.value.trim();
    if (!msgText) return;

    if (!currentChatFriendKey) {
      return alert("Pilih menu teman terlebih dahulu untuk mulai mengirim pesan!");
    }

    if (!activeConnection || activeConnection.peer !== currentChatFriendKey) {
      activeConnection = peer.connect(currentChatFriendKey);
      setupChat(activeConnection);
      setTimeout(() => {
        activeConnection.send(msgText);
      }, 500);
    } else {
      activeConnection.send(msgText);
    }

    document.getElementById('chatLog').innerHTML += `<div>Anda: ${msgText}</div>`;
    input.value = "";
  }

  function toggleCamera() {
    const track = localStream.getVideoTracks()[0];
    track.enabled = !track.enabled;
    const btn = document.getElementById('btnToggleCam');
    btn.classList.toggle('active', !track.enabled);
    btn.textContent = track.enabled ? "Matikan Video" : "Nyalakan Video";
  }

  function toggleAudio() {
    const track = localStream.getAudioTracks()[0];
    track.enabled = !track.enabled;
    const btn = document.getElementById('btnToggleMic');
    btn.classList.toggle('active', !track.enabled);
    btn.textContent = track.enabled ? "Matikan Audio" : "Nyalakan Audio";
  }
</script>

</body>
</html>
